name: CI

on:
  push:
    branches: [master, devel]
    tags: ["v*.*.*"]
  pull_request:
    branches: [master, devel]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install package with dev dependencies
        run: uv sync --extra dev --frozen

      - name: ruff check
        run: uv run ruff check src/ tests/

      - name: ruff format
        run: uv run ruff format --check src/ tests/

  test:
    name: pytest / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: uv sync --extra dev --frozen

      - name: Run tests
        run: uv run pytest tests/ -v --cov=tinymapper --cov-report=term-missing

  test_commands:
    name: Integration tests / micromamba
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: env/conda-lock.yml
          environment-name: tinymapper
          init-shell: bash
          cache-environment: true

      - name: Reinstall local package with dev dependencies
        run: pip install -e .[dev]
        shell: micromamba-shell {0}

      - name: Run tests under micromamba env
        run: pytest tests/test_integration.py -v --cov=tinymapper --cov-report=term-missing
        shell: micromamba-shell {0}

      - name: Create micromamba environment file
        run: micromamba env export -n tinymapper > tinymapper_env.yaml

      - name: Upload micromamba environment as artifact
        uses: actions/upload-artifact@v7
        with:
          name: tinymapper_env.yaml
          path: tinymapper_env.yaml
          overwrite: true
          archive: false

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [test, test_commands]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build distribution
        run: uv build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
